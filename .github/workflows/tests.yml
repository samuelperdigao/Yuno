name: Yuno tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yuno_test
          POSTGRES_PASSWORD: yuno_test
          POSTGRES_DB: yuno_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yuno_test -d yuno_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt -r bot/requirements.txt
      - name: Run complete suite with PostgreSQL concurrency checks
        env:
          PYTHONPATH: backend:bot
          YUNO_TEST_POSTGRES_URL: postgresql+asyncpg://yuno_test:yuno_test@127.0.0.1:5432/yuno_test
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q backend/app bot/yuno_bot backend/migrations/versions
